name: Ionic Security
description: >-
  Ionic Security was an Atlanta, Georgia data-protection and dynamic-authorization
  company whose Machina platform let developers add data access, control, and
  protection to any application with a small amount of code. Machina provided an
  API-driven service layer for just-in-time enforcement of data-access policies —
  evaluating user, device, service, environment, and data attributes to allow or
  deny each request — backed by client SDKs for Java, C, C++, C#, Objective-C,
  Python, and JavaScript, a Machina CLI, and cloud-storage integrations for AWS
  S3, Google Cloud Storage, and Azure Storage. Ionic was venture-backed (GV,
  Kleiner Perkins, Ten Eleven Ventures) and was acquired by Twilio in April 2021
  for roughly $30.2 million to accelerate Twilio's data-security capabilities.
  The company's developer domains (ionic.com, dev.ionic.com, api.ionic.com) are
  no longer live, but the first-party SDKs and CLI remain published on Maven
  Central, PyPI, and the IonicDev GitHub organization.

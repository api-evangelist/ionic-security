notes: >-
  Ionic Security (Machina data-protection platform) was acquired by Twilio in
  April 2021. Its developer domains (ionic.com / dev.ionic.com / api.ionic.com)
  are no longer live (ionic.com is a parked brand-protection page), but the
  first-party SDKs remain published on Maven Central, PyPI, and the IonicDev
  GitHub organization. Only libraries verified as first-party (com.ionic /
  com.ionic.cloudstorage Maven groups, PyPI author "Ionic Security Inc.", and
  the IonicDev GitHub org) are marked official. The unrelated "@ionic/*" npm
  packages belong to the Ionic Framework (Drifty) and are NOT included.
